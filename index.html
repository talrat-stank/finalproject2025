<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>File Upload</title>
    <script type="module" src="development.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Dum Drum Machine</h1>
    </header>
    <div>
      <h3>bpm</h3>
      <div id="bpmSlider" role="slider">
        <label for="bpm"></label>
        <input
          id="bpm"
          type="range"
          min="6"
          max="20"
          now="9.2"
          step="0.1"
        /><label for="bpm"></label>
      </div>
    </div>

    <section class="controls" aria-label="Player controls">
      <!-- input for user's audio file -->
      <input id="fileUpload" type="file" accept="audio/*" />
      <input id="fileUploadTwo" type="file" accept="audio/*" />
      <input id="fileUploadThree" type="file" accept="audio/*" />
      <button id="play" type="button">Play</button>
      <button id="stop" type="button">Stop</button>
      <button id="reverse" type="button">Reverse</button>
      <button id="reset" type="button">Reset</button>
      <span id="status" class="note" role="status" aria-live="polite"></span>
    </section>
    <table>
      <thead>
        <th>Bar</th>
        <th>Beat</th>
        <th>16th</th>
        <th>Count</th>
      </thead>
      <tbody>
        <tr>
          <td id="bar">1</td>
          <td id="beat">1</td>
          <td id="sixteenth">1</td>
          <td id="count">1</td>
        </tr>
      </tbody>
    </table>
    <!-- Rectangular toggle box -->
    <div id="toggleRow"></div>
    <div id="toggleRowTwo"></div>
    <div id="toggleRowThree"></div>
    <header>
      <h4>Channel One</h4>
    </header>
    <div>
      <label for="gain">Gain 1</label>
      <input id="gain" type="range" min="0" max="10" now="5" step="0.1" /><label
        for="gain"
      ></label>
    </div>
    <!-- <label class="switch">
      <input type="checkbox" />
      <span class="slider"></span>
    </label> -->
  </body>
</html>
